<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetria Térmica e Bem-Estar</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/htmx.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        .contribution-cell {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin: 1px;
        }
        .color-0 { background-color: #ebedf0; }
        .color-1 { background-color: #9be9a8; }
        .color-2 { background-color: #40c463; }
        .color-3 { background-color: #30a14e; }
        .color-4 { background-color: #216e39; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center">Telemetria Térmica e Bem-Estar</h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Leitura Atual</h2>
                <div id="currentReading" 
                     hx-get="/api/current/html"
                     hx-trigger="load, every 60s"
                     hx-swap="outerHTML"
                     hx-indicator="#loading">
                    Carregando...
                </div>
                <span id="loading" class="htmx-indicator text-sm text-gray-400">Atualizando...</span>
            </div>

            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Calendário Térmico</h2>
                <div class="overflow-x-auto">
                    <div id="contributionGraph" class="flex flex-wrap gap-1"></div>
                </div>
                <div class="flex items-center gap-2 mt-4 text-xs text-gray-400">
                    <span>Menos</span>
                    <div class="contribution-cell color-0"></div>
                    <div class="contribution-cell color-1"></div>
                    <div class="contribution-cell color-2"></div>
                    <div class="contribution-cell color-3"></div>
                    <div class="contribution-cell color-4"></div>
                    <span>Mais</span>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Histórico de Temperatura</h2>
            <div class="mb-4 flex gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data Início</label>
                    <input type="datetime-local" id="startDate" class="bg-gray-700 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data Fim</label>
                    <input type="datetime-local" id="endDate" class="bg-gray-700 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">&nbsp;</label>
                    <button onclick="loadHistory()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Carregar</button>
                </div>
            </div>
            <canvas id="historyChart"></canvas>
        </div>

        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Dias Mais Quentes</h2>
            <div id="hotDays" 
                 hx-get="/api/stats/hot-days/html"
                 hx-trigger="load"
                 hx-swap="innerHTML"
                 class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Registre Sua Sensação</h2>
            <form id="feelingForm" hx-post="/api/feeling" hx-swap="none" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data</label>
                    <input type="date" id="feelingDate" name="date" required class="bg-gray-700 rounded px-3 py-2 text-white w-full">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Rating (1-5)</label>
                    <div id="ratingStars" class="flex gap-2">
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(1)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(2)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(3)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(4)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(5)">★</span>
                    </div>
                    <input type="hidden" id="feelingRating" name="rating" value="0">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nota</label>
                    <textarea id="feelingNote" name="note" class="bg-gray-700 rounded px-3 py-2 text-white w-full" rows="3"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Tag (opcional)</label>
                    <input type="text" id="feelingTag" name="feeling_tag" class="bg-gray-700 rounded px-3 py-2 text-white w-full" placeholder="ex: confortável, quente, frio">
                </div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded text-white">Salvar</button>
            </form>
        </div>
    </div>

    <div id="dayModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-semibold mb-4" id="modalDate"></h3>
            <div id="modalContent"></div>
            <div class="mt-4 flex gap-2">
                <button onclick="closeModal()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white">Fechar</button>
                <button onclick="editFeeling()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Editar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
