<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetria Térmica e Bem-Estar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .contribution-cell {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin: 1px;
        }
        .color-0 { background-color: #ebedf0; }
        .color-1 { background-color: #9be9a8; }
        .color-2 { background-color: #40c463; }
        .color-3 { background-color: #30a14e; }
        .color-4 { background-color: #216e39; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center">Telemetria Térmica e Bem-Estar</h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Leitura Atual</h2>
                <div id="currentReading" class="text-center">
                    <p class="text-4xl font-bold text-green-400 mb-2">--°C</p>
                    <p class="text-2xl text-blue-400">--%</p>
                    <p class="text-sm text-gray-400 mt-2" id="lastUpdate">Carregando...</p>
                </div>
            </div>

            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Calendário Térmico</h2>
                <div class="overflow-x-auto">
                    <div id="contributionGraph" class="flex flex-wrap gap-1"></div>
                </div>
                <div class="flex items-center gap-2 mt-4 text-xs text-gray-400">
                    <span>Menos</span>
                    <div class="contribution-cell color-0"></div>
                    <div class="contribution-cell color-1"></div>
                    <div class="contribution-cell color-2"></div>
                    <div class="contribution-cell color-3"></div>
                    <div class="contribution-cell color-4"></div>
                    <span>Mais</span>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Histórico de Temperatura</h2>
            <div class="mb-4 flex gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data Início</label>
                    <input type="datetime-local" id="startDate" class="bg-gray-700 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data Fim</label>
                    <input type="datetime-local" id="endDate" class="bg-gray-700 rounded px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">&nbsp;</label>
                    <button onclick="loadHistory()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Carregar</button>
                </div>
            </div>
            <canvas id="historyChart"></canvas>
        </div>

        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Dias Mais Quentes</h2>
            <div id="hotDays" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Registre Sua Sensação</h2>
            <form id="feelingForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data</label>
                    <input type="date" id="feelingDate" required class="bg-gray-700 rounded px-3 py-2 text-white w-full">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Rating (1-5)</label>
                    <div id="ratingStars" class="flex gap-2">
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(1)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(2)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(3)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(4)">★</span>
                        <span class="cursor-pointer text-3xl text-gray-500 hover:text-yellow-400" onclick="setRating(5)">★</span>
                    </div>
                    <input type="hidden" id="feelingRating" value="0">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nota</label>
                    <textarea id="feelingNote" class="bg-gray-700 rounded px-3 py-2 text-white w-full" rows="3"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Tag (opcional)</label>
                    <input type="text" id="feelingTag" class="bg-gray-700 rounded px-3 py-2 text-white w-full" placeholder="ex: confortável, quente, frio">
                </div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded text-white">Salvar</button>
            </form>
        </div>
    </div>

    <div id="dayModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-semibold mb-4" id="modalDate"></h3>
            <div id="modalContent"></div>
            <div class="mt-4 flex gap-2">
                <button onclick="closeModal()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white">Fechar</button>
                <button onclick="editFeeling()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Editar</button>
            </div>
        </div>
    </div>

    <script>
        let currentRating = 0;
        let historyChart = null;
        let selectedDate = null;

        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return null;
            }
        }

        async function loadCurrent() {
            const data = await fetchAPI('/api/current');
            if (data && data.status === 'ok') {
                document.getElementById('currentReading').innerHTML = `
                    <p class="text-4xl font-bold text-green-400 mb-2">${data.temp.toFixed(1)}°C</p>
                    <p class="text-2xl text-blue-400">${data.humidity.toFixed(1)}%</p>
                    <p class="text-sm text-gray-400 mt-2">${new Date(data.timestamp).toLocaleString('pt-BR')}</p>
                `;
            }
        }

        async function loadHotDays() {
            const data = await fetchAPI('/api/stats/hot-days?limit=6');
            if (data && Array.isArray(data)) {
                const container = document.getElementById('hotDays');
                container.innerHTML = data.map(day => `
                    <div class="bg-gray-700 rounded p-4">
                        <p class="font-semibold text-yellow-400">${new Date(day.date).toLocaleDateString('pt-BR')}</p>
                        <p class="text-2xl font-bold">${day.avg_temp.toFixed(1)}°C</p>
                        <p class="text-sm text-gray-400">Média</p>
                        <p class="text-sm text-gray-400">Max: ${day.max_temp.toFixed(1)}°C | Min: ${day.min_temp.toFixed(1)}°C</p>
                    </div>
                `).join('');
            }
        }

        async function loadHistory() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert('Selecione as datas');
                return;
            }

            const data = await fetchAPI(`/api/history?start=${new Date(startDate).toISOString()}&end=${new Date(endDate).toISOString()}`);
            if (data && Array.isArray(data)) {
                const labels = data.map(m => new Date(m.timestamp).toLocaleString('pt-BR'));
                const temps = data.map(m => m.temp);
                const humidity = data.map(m => m.humidity);

                if (historyChart) {
                    historyChart.destroy();
                }

                const ctx = document.getElementById('historyChart').getContext('2d');
                historyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Temperatura (°C)',
                                data: temps,
                                borderColor: 'rgb(74, 222, 128)',
                                backgroundColor: 'rgba(74, 222, 128, 0.1)',
                                tension: 0.1
                            },
                            {
                                label: 'Umidade (%)',
                                data: humidity,
                                borderColor: 'rgb(96, 165, 250)',
                                backgroundColor: 'rgba(96, 165, 250, 0.1)',
                                tension: 0.1,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                grid: {
                                    drawOnChartArea: false,
                                },
                            },
                        }
                    }
                });
            }
        }

        function generateContributionGraph() {
            const container = document.getElementById('contributionGraph');
            container.innerHTML = '';

            const today = new Date();
            const oneYearAgo = new Date(today.getFullYear() - 1, today.getMonth(), today.getDate());

            for (let d = oneYearAgo; d <= today; d.setDate(d.getDate() + 1)) {
                const cell = document.createElement('div');
                cell.className = 'contribution-cell cursor-pointer hover:opacity-80';
                cell.dataset.date = d.toISOString().split('T')[0];

                const random = Math.random();
                let colorClass = 'color-0';
                if (random < 0.2) colorClass = 'color-1';
                else if (random < 0.4) colorClass = 'color-2';
                else if (random < 0.6) colorClass = 'color-3';
                else if (random < 0.8) colorClass = 'color-4';

                cell.classList.add(colorClass);
                cell.onclick = () => openDayModal(d.toISOString().split('T')[0]);
                container.appendChild(cell);
            }
        }

        function openDayModal(date) {
            selectedDate = date;
            document.getElementById('dayModal').classList.remove('hidden');
            document.getElementById('dayModal').classList.add('flex');
            document.getElementById('modalDate').textContent = new Date(date).toLocaleDateString('pt-BR');
            document.getElementById('modalContent').innerHTML = '<p class="text-gray-400">Carregando...</p>';
        }

        function closeModal() {
            document.getElementById('dayModal').classList.add('hidden');
            document.getElementById('dayModal').classList.remove('flex');
            selectedDate = null;
        }

        function editFeeling() {
            if (!selectedDate) return;
            document.getElementById('feelingDate').value = selectedDate;
            closeModal();
            document.getElementById('feelingForm').scrollIntoView({ behavior: 'smooth' });
        }

        function setRating(rating) {
            currentRating = rating;
            document.getElementById('feelingRating').value = rating;
            const stars = document.querySelectorAll('#ratingStars span');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('text-gray-500');
                    star.classList.add('text-yellow-400');
                } else {
                    star.classList.remove('text-yellow-400');
                    star.classList.add('text-gray-500');
                }
            });
        }

        document.getElementById('feelingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const feelingData = {
                date: document.getElementById('feelingDate').value,
                rating: parseInt(document.getElementById('feelingRating').value),
                note: document.getElementById('feelingNote').value,
                feeling_tag: document.getElementById('feelingTag').value
            };

            if (feelingData.rating < 1 || feelingData.rating > 5) {
                alert('Selecione um rating entre 1 e 5');
                return;
            }

            const response = await fetchAPI('/api/feeling', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(feelingData)
            });

            if (response && response.message) {
                alert('Sensação salva com sucesso!');
                document.getElementById('feelingForm').reset();
                setRating(0);
            }
        });

        document.getElementById('feelingDate').valueAsDate = new Date();
        const endDate = new Date();
        const startDate = new Date(endDate.getTime() - 24 * 60 * 60 * 1000);
        document.getElementById('startDate').value = startDate.toISOString().slice(0, 16);
        document.getElementById('endDate').value = endDate.toISOString().slice(0, 16);

        loadCurrent();
        loadHotDays();
        loadHistory();
        generateContributionGraph();

        setInterval(loadCurrent, 60000);
    </script>
</body>
</html>
